name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${IMAGE_TAG} ./client
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${IMAGE_TAG} ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${IMAGE_TAG} ./server
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${IMAGE_TAG} ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${IMAGE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:latest

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${IMAGE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:latest